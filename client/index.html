<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="/">
    <title>Resursbokning</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="lang/sv.js"></script>
    <script src="lang/en.js"></script>
    <script src="i18n.js"></script>
    <script>
        // API Configuration
        axios.defaults.baseURL = '/api';

        // Handle API errors globally
        axios.interceptors.response.use(
            response => response,
            error => {
                console.error('API Error:', error.response?.data || error.message);
                return Promise.reject(error);
            }
        );
    </script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 data-i18n="app_title">Resursbokning</h1>
            <div style="display:flex;align-items:center;gap:8px">
                <select id="langPicker" class="lang-picker">
                    <option value="sv">🇸🇪 Svenska</option>
                    <option value="en">🇬🇧 English</option>
                </select>
                <div class="user-info" id="userInfo" style="display: none;">
                    <span id="userName"></span>
                    <button id="logoutButton" class="logout-button" data-i18n="logout">Logga ut</button>
                </div>
            </div>
        </div>
        
        <div class="calendar-controls">
            <button id="prevMonth">&lt;</button>
            <h2 id="monthDisplay"></h2>
            <button id="nextMonth">&gt;</button>
        </div>

        <div class="calendar" id="calendar">
            <div class="calendar-header">
                <div data-i18n="day_sun">Sön</div>
                <div data-i18n="day_mon">Mån</div>
                <div data-i18n="day_tue">Tis</div>
                <div data-i18n="day_wed">Ons</div>
                <div data-i18n="day_thu">Tor</div>
                <div data-i18n="day_fri">Fre</div>
                <div data-i18n="day_sat">Lör</div>
            </div>
            <div id="calendarDays" class="calendar-days"></div>
        </div>

        <div id="bookingModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h3 data-i18n="step1_title">Välj resurs</h3>
                <form id="bookingForm">
                    <div class="booking-step" id="step1">
                        <div class="form-group">
                            <label for="resourceSelect" data-i18n="select_resource_label">Välj resurs:</label>
                            <select id="resourceSelect" required>
                                <option value="" data-i18n="select_resource_placeholder">Välj en resurs...</option>
                            </select>
                        </div>
                        <div class="resource-info" id="resourceInfo"></div>
                        <button type="button" id="nextStep" disabled data-i18n="btn_next">Nästa</button>
                    </div>
                    
                    <div class="booking-step" id="step2" style="display: none;">
                        <div class="form-group">
                            <label for="timeSlot" data-i18n="select_time_label">Välj tid:</label>
                            <select id="timeSlot" required></select>
                        </div>
                        <div class="button-group">
                            <button type="button" id="prevStep" data-i18n="btn_back">Tillbaka</button>
                            <button type="submit" data-i18n="btn_book">Boka</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Day View Modal -->
    <div id="dayViewModal" class="modal">
        <div class="modal-content day-view-content">
            <span class="close" id="closeDayView">&times;</span>
            <h3 id="dayViewDate">Date</h3>
            <div class="time-slots-container">
                <div class="time-slots">
                    <!-- Time slots will be populated by JavaScript -->
                </div>
            </div>
        </div>
    </div>

    <div class="resources-section">
        <h2 data-i18n="resources_title">Tillgängliga resurser</h2>
        <div id="resourceList" class="resource-list"></div>
    </div>

<script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            initI18n();
        });
    </script>
</body>
</html>
